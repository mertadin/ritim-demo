<svg xmlns="http://www.w3.org/2000/svg" width="240" height="339" viewBox="0 0 1240 1754" font-family="Helvetica, Arial, sans-serif">
<rect width="1240" height="1754" fill="#fff"/>
<rect x="60" y="60" width="1120" height="1634" fill="none" stroke="#c9ced6" stroke-width="2"/>
<text x="100" y="140" font-size="40" font-weight="700" fill="#2b3a4a">Örnek Hastanesi</text>
<text x="100" y="180" font-size="24" fill="#6b7785">Kardiyoloji Bölümü · Uydurma kurum, örnek belge</text>
<line x1="100" y1="205" x2="1140" y2="205" stroke="#2b3a4a" stroke-width="3"/>
<text x="100" y="270" font-size="34" font-weight="700" fill="#1d2733">Taburculuk Özeti (Epikriz)</text>
<text x="100" y="312" font-size="24" fill="#6b7785">Koroner anjiyografi ve stent işlemi sonrası · örnek</text>
<text x="100" y="380" font-size="26" fill="#1d2733">Hasta: Ahmet Demo</text>
<text x="620" y="380" font-size="26" fill="#1d2733">Protokol: ÖRNEK-0001</text>
<line x1="100" y1="410" x2="1140" y2="410" stroke="#c9ced6" stroke-width="2"/><text x="100" y="470" font-size="28" fill="#1d2733">Giriş tanısı: Kararlı olmayan göğüs ağrısı (örnek kayıt)</text><text x="100" y="522" font-size="28" fill="#1d2733">Yapılan işlem: Koroner anjiyografi, iki damara stent (örnek)</text><text x="100" y="574" font-size="28" fill="#1d2733">Giriş yeri: Sağ el bileği (radiyal)</text><text x="100" y="626" font-size="28" fill="#1d2733"></text><text x="100" y="678" font-size="28" fill="#1d2733">Bulgular</text><text x="100" y="730" font-size="28" fill="#1d2733">  LAD proksimal darlık: stent yerleştirildi</text><text x="100" y="782" font-size="28" fill="#1d2733">  RCA orta bölüm darlık: stent yerleştirildi</text><text x="100" y="834" font-size="28" fill="#1d2733">  Sol ventrikül sistolik fonksiyonu: normal sınırlarda</text><text x="100" y="886" font-size="28" fill="#1d2733"></text><text x="100" y="938" font-size="28" fill="#1d2733">Taburculuk önerileri</text><text x="100" y="990" font-size="28" fill="#1d2733">  Düzenli ilaç kullanımı (liste ayrıca verilir)</text><text x="100" y="1042" font-size="28" fill="#1d2733">  Sigara ve alkolden uzak durma</text><text x="100" y="1094" font-size="28" fill="#1d2733">  Tuz kısıtlaması, düzenli yürüyüş</text><text x="100" y="1146" font-size="28" fill="#1d2733">  Kontrol randevusu: kardiyoloji polikliniği</text><text x="100" y="1198" font-size="28" fill="#1d2733"></text><text x="100" y="1250" font-size="28" fill="#1d2733">Hekim: Dr. Elif Örnek (uydurma)</text><text x="620" y="1050" font-size="300" font-weight="700" fill="#808080" fill-opacity="0.14" text-anchor="middle" transform="rotate(-30 620 1050)">ÖRNEK</text><text x="100" y="1640" font-size="20" fill="#8a94a0">Bu belge uydurmadır; gerçek bir kişiyi veya kaydı göstermez.</text></svg>
