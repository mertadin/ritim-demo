<line x1="100" y1="410" x2="1140" y2="410" stroke="#c9ced6" stroke-width="2"/><text x="100" y="470" font-size="26" font-weight="700" fill="#1d2733">Ölçüm</text><text x="640" y="470" font-size="26" font-weight="700" fill="#1d2733">Değer</text><text x="860" y="470" font-size="26" font-weight="700" fill="#1d2733">Referans</text><rect x="100" y="492" width="1040" height="62" fill="#f3f5f8"/><text x="100" y="532" font-size="26" fill="#1d2733">Sol ventrikül EF</text><text x="640" y="532" font-size="26" fill="#1d2733">%58</text><text x="860" y="532" font-size="26" fill="#1d2733">%55 - %70</text><text x="100" y="594" font-size="26" fill="#1d2733">Sol atriyum çapı</text><text x="640" y="594" font-size="26" fill="#1d2733">36 mm</text><text x="860" y="594" font-size="26" fill="#1d2733">27 - 40 mm</text><rect x="100" y="616" width="1040" height="62" fill="#f3f5f8"/><text x="100" y="656" font-size="26" fill="#1d2733">Septum kalınlığı</text><text x="640" y="656" font-size="26" fill="#1d2733">10 mm</text><text x="860" y="656" font-size="26" fill="#1d2733">6 - 11 mm</text><text x="100" y="718" font-size="26" fill="#1d2733">Arka duvar kalınlığı</text><text x="640" y="718" font-size="26" fill="#1d2733">9 mm</text><text x="860" y="718" font-size="26" fill="#1d2733">6 - 11 mm</text><rect x="100" y="740" width="1040" height="62" fill="#f3f5f8"/><text x="100" y="780" font-size="26" fill="#1d2733">Sol ventrikül diyastol sonu çapı</text><text x="640" y="780" font-size="26" fill="#1d2733">49 mm</text><text x="860" y="780" font-size="26" fill="#1d2733">39 - 53 mm</text><text x="100" y="842" font-size="26" fill="#1d2733">Aort kökü</text><text x="640" y="842" font-size="26" fill="#1d2733">31 mm</text><text x="860" y="842" font-size="26" fill="#1d2733">20 - 37 mm</text><text x="100" y="950" font-size="28" fill="#1d2733">Bulgular</text><text x="100" y="1000" font-size="28" fill="#1d2733">  Duvar hareketleri normal (örnek kayıt).</text><text x="100" y="1050" font-size="28" fill="#1d2733">  Kapakl